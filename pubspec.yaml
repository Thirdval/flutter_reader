name: flutter_reader
description: "An engine-backed scrollable list: exact jumps to any item without building what lies between, a reference item kept fixed while content changes around it, reverse (chat) mode, lazy loading gated on the cache extent, and text search."
version: 2.1.0
homepage: https://github.com/Thirdval/flutter_reader
repository: https://github.com/Thirdval/flutter_reader
issue_tracker: https://github.com/Thirdval/flutter_reader/issues

topics:
  - scroll
  - reader
  - chat
  - widgets
  - performance

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
